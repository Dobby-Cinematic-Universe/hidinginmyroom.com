[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "himr-corpus"
version = "0.2.0"
description = "Reproducible source catalog and static transcript-corpus builder for HIMR"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
himr-corpus = "himr_corpus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
